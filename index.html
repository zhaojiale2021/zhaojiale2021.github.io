<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赵家乐的个人网站</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #2563eb;
      --border: #e4e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }
    .header {
      text-align: center;
      padding: 48px 20px 20px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }
    .name {
      font-size: 28px;
      font-weight: 700;
      margin: 14px 0 2px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 14px;
    }
    .container {
      max-width: 880px;
      margin: 0 auto 40px;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 32px 0 16px;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
    }
    .intro {
      text-align: center;
      font-size: 16px;
    }
    .qrcode {
      display: block;
      margin: 18px auto 8px;
      width: 240px;
      height: 240px;
      max-width: 80%;
      border-radius: 10px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }
    .link-btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      border: 1px solid #dbeafe;
      transition: background .15s ease;
    }
    .link-btn:hover {
      background: #dbeafe;
    }
    .repo-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .repo-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }
    .repo-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .repo-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .repo-name:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
    }
    .repo-desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .repo-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .topic {
      font-size: 12px;
      color: #334155;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 2px 8px;
    }
    .repo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .repo-meta a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer {
      text-align: center;
      padding: 28px 16px 40px;
      color: var(--muted);
      font-size: 13px;
    }
    .footer a { color: var(--accent); text-decoration: none; }
    .error { color: #b91c1c; font-size: 13px; }
  </style>
</head>
<body>

    <img class="avatar" src="OIP.jpg" alt="赵家乐">

  <div class="container">

    <h2 class="section-title">GitHub 仓库</h2>

  <script>
    const owner = 'zhaojiale2021';
    const SITE_REPO = 'zhaojiale2021.github.io';
    const NAME_MAP = {
      'daily_stock_analysis': '股票智能分析系统',
      'omniview': 'Omniview · 360° 全景视频播放器',
      'autosar-busmirror-dissector': 'AUTOSAR BusMirror Dissector',
      'USB2X': 'USB2X · 多协议转换'
    };

    function languageColor(name) {
      const colors = {
        Rust: '#dea584',
        Python: '#3572A5',
        C: '#555555',
        Lua: '#000080',
        HTML: '#e34c26'
      };
      return colors[name] || '#8b949e';
    }

    function formatDate(value) {
      if (!value) return '';
      try {
        return new Date(value).toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
      } catch (e) {
        return value;
      }
    }

    function translateDescription(repo) {
      const zh = {
        'daily_stock_analysis': 'LLM 驱动的多市场股票智能分析系统：多源行情、实时新闻、决策看板与自动推送，支持零成本定时运行。',
        'omniview': '基于 Rust（ffmpeg-next + wgpu + egui）的 360° 全景视频播放器，支持普通视频/全景视频、多音轨、字幕、播放列表等。',
        'autosar-busmirror-dissector': 'AUTOSAR BusMirror 协议的 Wireshark Lua dissector 与测试报文生成器。',
        'USB2X': '使用 STM32 等 MCU 实现 USB 转任意通信协议的固件 / 工具。'
      };
      return zh[repo.name] || repo.description || '暂无项目描述';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function renderRepos(repos) {
      const list = document.getElementById('repo-list');
      const projects = repos
        .filter(repo => repo.name !== SITE_REPO)
        .sort((a, b) => new Date(b.pushed_at || b.updated_at || 0) - new Date(a.pushed_at || a.updated_at || 0));
      list.innerHTML = '';
      if (projects.length === 0) {
        list.innerHTML = '<p>暂无公开仓库。</p>';
        return;
      }
      projects.forEach(repo => {
        const card = document.createElement('div');
        card.className = 'repo-card';

        const head = document.createElement('div');
        head.className = 'repo-head';
        const repoName = document.createElement('a');
        repoName.className = 'repo-name';
        repoName.href = repo.html_url;
        repoName.target = '_blank';
        repoName.rel = 'noopener noreferrer';
        repoName.textContent = NAME_MAP[repo.name] || repo.name;
        head.appendChild(repoName);

        if (repo.fork) {
          const forkBadge = document.createElement('span');
          forkBadge.className = 'badge';
          forkBadge.textContent = 'Fork';
          head.appendChild(forkBadge);
        }
        if (repo.language) {
          const langBadge = document.createElement('span');
          langBadge.className = 'badge';
          langBadge.textContent = repo.language;
          langBadge.style.background = languageColor(repo.language) + '22';
          langBadge.style.color = languageColor(repo.language);
          head.appendChild(langBadge);
        }
        card.appendChild(head);

        const desc = document.createElement('p');
        desc.className = 'repo-desc';
        desc.textContent = translateDescription(repo);
        card.appendChild(desc);

        if (repo.topics && repo.topics.length) {
          const topics = document.createElement('div');
          topics.className = 'repo-topics';
          repo.topics.forEach(topic => {
            const tag = document.createElement('span');
            tag.className = 'topic';
            tag.textContent = topic;
            topics.appendChild(tag);
          });
          card.appendChild(topics);
        }

        const meta = document.createElement('div');
        meta.className = 'repo-meta';
        const pushed = document.createElement('span');
        pushed.textContent = '更新于 ' + formatDate(repo.pushed_at || repo.updated_at);
        meta.appendChild(pushed);
        const link = document.createElement('a');
        link.href = repo.html_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'GitHub ↗';
        meta.appendChild(link);
        if (repo.homepage) {
          const home = document.createElement('a');
          home.href = repo.homepage;
          home.target = '_blank';
          home.rel = 'noopener noreferrer';
          home.textContent = '在线预览 ↗';
          meta.appendChild(home);
        }
        card.appendChild(meta);
        list.appendChild(card);
      });
    }

    async function loadRepos() {
      try {
        const response = await fetch('https://api.github.com/users/' + owner + '/repos?per_page=100&sort=updated');
        if (!response.ok) throw new Error('GitHub API error: ' + response.status);
        const repos = await response.json();
        renderRepos(repos);
      } catch (err) {
        const fallbackEl = document.getElementById('repo-fallback');
        const fallback = fallbackEl ? JSON.parse(fallbackEl.textContent) : [];
        renderRepos(fallback);
        const errEl = document.getElementById('repo-error');
        if (errEl && fallback.length) {
          errEl.hidden = false;
          errEl.textContent = '当前显示为内置缓存数据，实时 GitHub 数据加载失败。';
        }
      }
    }

    document.getElementById('year').textContent = new Date().getFullYear();
    loadRepos();
  </script>
