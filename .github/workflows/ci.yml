name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8          # 脚本输出里有中文, 默认编码不是 UTF-8 时会乱码

jobs:
  page:
    name: HTML / 缓存校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 页面是单文件, 直接用默认的 html-validate:recommended 规则集
      - name: html-validate
        run: npx --yes html-validate@11 index.html

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 校验 index.html 里 <script id="repo-fallback"> 的字段、顺序与格式 (不联网)
      - name: 内置仓库缓存
        run: python scripts/sync_repos.py --check

  links:
    name: 链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress index.html README.md
          fail: true
