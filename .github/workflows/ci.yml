name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8          # 脚本输出里有中文, 默认编码不是 UTF-8 时会乱码

jobs:
  page:
    name: HTML / 缓存校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 页面是单文件, 直接用默认的 html-validate:recommended 规则集
      - name: html-validate
        run: npx --yes html-validate@11 index.html

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 校验 index.html 里 <script id="repo-data"> 的字段、顺序与格式 (不联网)
      - name: 内置仓库数据
        run: python scripts/sync_repos.py --check

  links:
    name: 链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress index.html README.md
          fail: true

  # 汇总门禁:分支 ruleset 只要求 "CI required" 这一个稳定的检查名,
  # 以后增删作业或给作业改名,都不用回头改 ruleset。
  gate:
    name: CI required
    runs-on: ubuntu-latest
    needs: [page, links]
    if: always()
    steps:
      - name: 所有上游作业都成功才算通过
        run: |
          echo "page=${{ needs.page.result }} links=${{ needs.links.result }}"
          if [ "${{ needs.page.result }}" != "success" ] || [ "${{ needs.links.result }}" != "success" ]; then
            echo "::error::上游作业失败或被取消,门禁不通过"
            exit 1
          fi
