name: Sync repo cache

on:
  schedule:
    - cron: "17 3 * * 1"     # 每周一 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-repo-cache
  cancel-in-progress: true

jobs:
  sync:
    name: 刷新内置仓库缓存
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 带上 token 只是为了提高限流额度; 脚本只写公开仓库, 不会把私有仓库带进页面
      - name: 拉取公开仓库并写回 index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repos.py

      - name: 提交（含 synced_at 时间戳，每周一次，顺带让定时任务不被停用）
        run: |
          if git diff --quiet; then
            echo "数据无变化，无需提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync GitHub repository data"
          git push
